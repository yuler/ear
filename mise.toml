[tools]
"github:longbridge/nsh" = "0.7.1"
wrangler = "latest"
xcodegen = { version = "2.48.0", os = ["macos"] }

[env]
_.file = ".env"

[tasks."cli:build"]
description = "Release-build Ear CLI and install to ~/.local/bin/ear"
alias = ["build-cli"]
run = "cargo build --release --manifest-path cli/Cargo.toml && install -Dm755 cli/target/release/ear ~/.local/bin/ear"

[tasks."cli:dev"]
description = "Debug-build Ear CLI for development (keeps ~/.local/bin/ear untouched)"
alias = ["build-cli-dev"]
run = "cargo build --manifest-path cli/Cargo.toml"

[tasks."cli:test"]
description = "Run Ear CLI Rust test suite"
run = "cargo test --manifest-path cli/Cargo.toml"

[tasks."desktop:dev"]
description = "Rebuild CLI (debug) then start native host"
alias = ["run"]
depends = ["cli:dev"]
run = 'PATH="$PWD/cli/target/debug:$PATH" nsh run desktop'

[tasks.dev]
description = "Run all active dev tasks in parallel (cli + desktop + web)"
depends = ["cli:dev", "desktop:dev", "web:dev"]

[tasks."desktop:check"]
description = "Run TypeScript and styling checks on Native Shell desktop app"
alias = ["check"]
run = "nsh check desktop"

[tasks."desktop:test"]
description = "Run tests on Native Shell desktop app"
run = "nsh test desktop"

[tasks."ios:gen"]
description = "Generate ios/Ear.xcodeproj from ios/project.yml with the resolved version"
run = "bash scripts/ios-xcodegen.sh"

[tasks."ios:open"]
description = "Generate ios/Ear.xcodeproj and open it in Xcode"
depends = ["ios:gen"]
run = "open ios/Ear.xcodeproj"

[tasks."ios:test"]
description = "Run native iOS unit tests on an available iPhone Simulator"
run = "bash scripts/ios-test.sh"

[tasks."ios:testflight:check"]
description = "Check TestFlight tooling (asc, gh), .env secrets, and ASC_APP_ID"
run = "bash scripts/setup-testflight.sh check"

[tasks."ios:legacy:dev"]
description = "Run archived Native Shell iOS app in development host (use --target ios on macOS)"
run = "nsh run ios-legacy --target ios"

[tasks."ios:legacy:check"]
description = "Run TypeScript and styling checks on archived Native Shell iOS app"
run = "nsh check ios-legacy"

[tasks."ios:legacy:test"]
description = "Run headless tests on archived Native Shell iOS app"
run = "nsh test ios-legacy"

[tasks."web:dev"]
description = "Start Cloudflare Worker & static site preview locally via Wrangler"
alias = ["www:dev"]
dir = "web"
run = "wrangler dev"

[tasks."web:deploy"]
description = "Deploy website & Cloudflare Worker to Cloudflare"
alias = ["deploy", "deploy-web", "www:deploy", "deploy-www"]
dir = "web"
run = "wrangler deploy"

[tasks.test]
description = "Run all tests across active subprojects (CLI + Desktop)"
depends = ["cli:test", "desktop:test"]

[tasks.doctor]
description = "Check system dependencies (WebKitGTK, GStreamer, ffmpeg)"
depends = ["cli:dev"]
run = "cli/target/debug/ear doctor"

[tasks.setup]
description = "Install tools, Ear CLI (release), and Linux host deps (WebKitGTK 6)"
run = "bash scripts/setup.sh"

[tasks."prod:install"]
description = "Download and install Production Ear desktop app & CLI from GitHub Releases"
run = "bash scripts/install-prod.sh"

[tasks."dev:import-prod"]
description = "Copy Production library data into the isolated Dev library directory"
run = "bash scripts/import-prod.sh"
