[tools]
"github:longbridge/nsh" = "0.6.1"
wrangler = "latest"

[env]
_.file = ".env"

[tasks."cli:build"]
description = "Release-build Ear CLI and install to ~/.local/bin/ear"
alias = ["build-cli"]
run = "cargo build --release --manifest-path cli/Cargo.toml && install -Dm755 cli/target/release/ear ~/.local/bin/ear"

[tasks."cli:dev"]
description = "Debug-build Ear CLI for development (keeps ~/.local/bin/ear untouched)"
alias = ["build-cli-dev"]
run = "cargo build --manifest-path cli/Cargo.toml"

[tasks."cli:test"]
description = "Run Ear CLI Rust test suite"
run = "cargo test --manifest-path cli/Cargo.toml"

[tasks."desktop:dev"]
description = "Rebuild CLI (debug) then start native host"
alias = ["run"]
depends = ["cli:dev"]
run = 'PATH="$PWD/cli/target/debug:$PATH" nsh run desktop'

[tasks.dev]
description = "Run all *:dev tasks in parallel (cli + desktop + web)"
depends = ["*:dev"]

[tasks."desktop:check"]
description = "Run TypeScript and styling checks on Native Shell desktop app"
alias = ["check"]
run = "nsh check desktop"

[tasks."desktop:test"]
description = "Run tests on Native Shell desktop app"
run = "nsh test desktop"

[tasks."ios:dev"]
description = "Run Ear iOS mobile app in development host (use --target ios on macOS)"
run = "nsh run ios --target ios"

[tasks."ios:check"]
description = "Run TypeScript and styling checks on Native Shell iOS app"
run = "nsh check ios"

[tasks."ios:test"]
description = "Run headless tests on Native Shell iOS app"
run = "nsh test ios"

[tasks."web:dev"]
description = "Start Cloudflare Worker & static site preview locally via Wrangler"
alias = ["www:dev"]
dir = "web"
run = "wrangler dev"

[tasks."web:deploy"]
description = "Deploy website & Cloudflare Worker to Cloudflare"
alias = ["deploy", "deploy-web", "www:deploy", "deploy-www"]
dir = "web"
run = "wrangler deploy"

[tasks.test]
description = "Run all tests across subprojects (CLI + Desktop + iOS)"
depends = ["cli:test", "desktop:test", "ios:test"]

[tasks.doctor]
description = "Check system dependencies (WebKitGTK, GStreamer, ffmpeg)"
depends = ["cli:dev"]
run = "cli/target/debug/ear doctor"

[tasks.setup]
description = "Install tools, Ear CLI (release), and Linux host deps (WebKitGTK 6)"
run = "bash scripts/setup.sh"

[tasks."prod:install"]
description = "Download and install Production Ear desktop app & CLI from GitHub Releases"
run = "bash scripts/install-prod.sh"

[tasks."dev:import-prod"]
description = "Copy Production library data into the isolated Dev library directory"
run = "bash scripts/import-prod.sh"
