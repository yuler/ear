[tools]
"github:longbridge/nsh" = "0.5.0"
wrangler = "latest"

[env]
_.file = ".env"

[tasks."cli:build"]
description = "Release-build Ear CLI and install to ~/.local/bin/ear"
alias = ["build-cli"]
run = "cargo build --release --manifest-path cli/Cargo.toml && install -Dm755 cli/target/release/ear ~/.local/bin/ear"

[tasks."cli:dev"]
description = "Debug-build Ear CLI for development (keeps ~/.local/bin/ear untouched)"
alias = ["build-cli-dev"]
run = "cargo build --manifest-path cli/Cargo.toml"

[tasks."cli:test"]
description = "Run Ear CLI Rust test suite"
run = "cargo test --manifest-path cli/Cargo.toml"

[tasks."app:dev"]
description = "Rebuild CLI (debug) then start native host"
alias = ["run"]
depends = ["cli:dev"]
run = "nsh run app"

[tasks.dev]
description = "Run all *:dev tasks in parallel (cli + app + www)"
depends = ["*:dev"]

[tasks."app:check"]
description = "Run TypeScript and styling checks on Native Shell desktop app"
alias = ["check"]
run = "nsh check app"

[tasks."app:test"]
description = "Run tests on Native Shell desktop app"
run = "nsh test app"

[tasks."www:dev"]
description = "Start Cloudflare Worker & static site preview locally via Wrangler"
dir = "www"
run = "wrangler dev"

[tasks."www:deploy"]
description = "Deploy website & Cloudflare Worker to Cloudflare"
alias = ["deploy", "deploy-www"]
dir = "www"
run = "wrangler deploy"

[tasks.test]
description = "Run all tests across subprojects (CLI + App)"
depends = ["cli:test", "app:test"]

[tasks.doctor]
description = "Check system dependencies (WebKitGTK, GStreamer, ffmpeg)"
depends = ["cli:dev"]
run = "ear doctor"

[tasks.setup]
description = "Install tools, Ear CLI (release), and Linux host deps (WebKitGTK 6)"
run = "bash scripts/setup.sh"

[tasks."prod:install"]
description = "Download and install Production Ear desktop app & CLI from GitHub Releases"
run = "bash scripts/install-prod.sh"
