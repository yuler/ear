name: release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'www/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag override (e.g. v0.0.2)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality Gate (Check & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mise + nsh
        uses: jdx/mise-action@v5

      - name: Typecheck
        run: mise run check

      - name: Test
        run: mise run test

  prepare:
    name: Resolve Version & Create Tag
    needs: quality-gate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      build: ${{ steps.vars.outputs.build }}
      release_title: ${{ steps.vars.outputs.release_title }}
      changelog: ${{ steps.vars.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch All Tags
        run: git fetch --tags --force

      - name: Resolve Version & Metadata
        id: vars
        shell: bash
        run: |
          OVERRIDE_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$OVERRIDE_TAG" ]; then
            TAG="$OVERRIDE_TAG"
            VERSION="${TAG#v}"
          else
            LATEST_TAG=$(git tag --sort=-v:refname -l "v*" 2>/dev/null | head -n 1 || true)
            if [ -z "$LATEST_TAG" ]; then
              VERSION="0.0.1"
            else
              V_CLEAN="${LATEST_TAG#v}"
              MAJOR=$(echo "$V_CLEAN" | cut -d. -f1)
              MINOR=$(echo "$V_CLEAN" | cut -d. -f2)
              PATCH=$(echo "$V_CLEAN" | cut -d. -f3 | cut -d- -f1)
              NEXT_PATCH=$((PATCH + 1))
              VERSION="${MAJOR:-0}.${MINOR:-0}.${NEXT_PATCH}"
            fi
            TAG="v$VERSION"
          fi

          BUILD=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          COMMIT_SUBJECT=$(git log -1 --format="%s" 2>/dev/null || echo "Release $TAG")

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "release_title=$TAG — $COMMIT_SUBJECT" >> "$GITHUB_OUTPUT"
          echo "changelog=$TAG — $COMMIT_SUBJECT" >> "$GITHUB_OUTPUT"

      - name: Create & Push Git Tag
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
          else
            echo "Tagging commit with $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "${{ steps.vars.outputs.release_title }}"
            git push origin "$TAG"
          fi

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: linux
          - platform: macos-arm64
            os: macos-latest
            target: macos
          - platform: windows-x64
            os: windows-latest
            target: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mise + nsh
        uses: jdx/mise-action@v5

      - name: Inject Release Version
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' app/nsh.json > app/nsh.json.tmp && mv app/nsh.json.tmp app/nsh.json
          sed -E "0,/version = \".*\"/s/version = \".*\"/version = \"$VERSION\"/" cli/Cargo.toml > cli/Cargo.toml.tmp && mv cli/Cargo.toml.tmp cli/Cargo.toml

      - name: Build Rust ear CLI
        shell: bash
        run: cargo build --release --manifest-path cli/Cargo.toml

      - name: Package NSH App (${{ matrix.target }})
        shell: bash
        run: nsh package --target ${{ matrix.target }} app/

      # Linux archive assembly
      - name: Assemble Linux Bundle
        if: matrix.target == 'linux'
        shell: bash
        run: |
          cp cli/target/release/ear .nsh/out/Ear/ear
          chmod +x .nsh/out/Ear/ear
          tar -czf "Ear-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz" -C .nsh/out Ear

      # macOS zip assembly
      - name: Assemble macOS Bundle
        if: matrix.target == 'macos'
        shell: bash
        run: |
          mkdir -p .nsh/out/Ear.app/Contents/MacOS
          cp cli/target/release/ear .nsh/out/Ear.app/Contents/MacOS/ear
          chmod +x .nsh/out/Ear.app/Contents/MacOS/ear
          ditto -c -k --keepParent .nsh/out/Ear.app "Ear-${{ needs.prepare.outputs.version }}-macos-arm64.zip"

      # Windows zip assembly
      - name: Assemble Windows Bundle
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Copy-Item "cli/target/release/ear.exe" -Destination ".nsh/out/Ear/ear.exe"
          Compress-Archive -Path ".nsh/out/Ear/*" -DestinationPath "Ear-${{ needs.prepare.outputs.version }}-windows-x64.zip"

      - name: Upload Platform Asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            Ear-${{ needs.prepare.outputs.version }}-*.tar.gz
            Ear-${{ needs.prepare.outputs.version }}-*.zip
          if-no-files-found: error

  publish-release:
    name: Publish Release & Manifest
    needs: [prepare, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mise + nsh
        uses: jdx/mise-action@v5

      - name: Inject Release Version
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' app/nsh.json > app/nsh.json.tmp && mv app/nsh.json.tmp app/nsh.json
          sed -E "0,/version = \".*\"/s/version = \".*\"/version = \"$VERSION\"/" cli/Cargo.toml > cli/Cargo.toml.tmp && mv cli/Cargo.toml.tmp cli/Cargo.toml

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-raw

      - name: Flatten artifacts into dist/
        shell: bash
        run: |
          mkdir -p dist
          find dist-raw -type f -exec mv {} dist/ \;
          ls -la dist/

      - name: Build Incremental Bytecode Bundle
        shell: bash
        run: |
          nsh package --target linux app/
          cp .nsh/out/Ear/nsh/bundle.nshc dist/bundle.nshc
          ls -lh dist/bundle.nshc

      - name: Generate Manifest, Checksums & Notes
        shell: bash
        run: |
          COMMIT_SUBJECT=$(git log -1 --format="%s" 2>/dev/null || echo "Release ${{ needs.prepare.outputs.tag }}")
          COMMIT_BODY=$(git log -1 --format="%b" 2>/dev/null || true)
          SHORT_SHA=$(git log -1 --format="%h" 2>/dev/null || echo "")
          COMMIT_SHA=$(git log -1 --format="%H" 2>/dev/null || echo "")
          AUTHOR=$(git log -1 --format="%an" 2>/dev/null || echo "Maintainer")

          cat <<EOF > dist/release_notes.md
### What's Changed
**${COMMIT_SUBJECT}**

${COMMIT_BODY}

---
- **Commit**: [\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${COMMIT_SHA})
- **Author**: ${AUTHOR}
EOF

          bash scripts/generate_manifest.sh \
            --version "${{ needs.prepare.outputs.version }}" \
            --build "${{ needs.prepare.outputs.build }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --changelog "${{ needs.prepare.outputs.changelog }}" \
            --assets-dir dist \
            --output dist/latest.json \
            --checksums dist/checksums.txt

      - name: Display Release Contents
        shell: bash
        run: |
          echo "=== Manifest latest.json ==="
          cat dist/latest.json
          echo "=== Checksums ==="
          cat dist/checksums.txt
          echo "=== Release Notes ==="
          cat dist/release_notes.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_title }}
          body_path: dist/release_notes.md
          files: dist/*
          draft: false
          prerelease: false
