name: release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'web/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag override (e.g. v0.0.2)'
        required: false
        default: ''
      full_update:
        description: 'Force a full app update (omit OTA from the manifest)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Version & Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      build: ${{ steps.vars.outputs.build }}
      release_title: ${{ steps.vars.outputs.release_title }}
      changelog: ${{ steps.vars.outputs.changelog }}
      release_mode: ${{ steps.vars.outputs.release_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch All Tags
        run: git fetch --tags --force

      - name: Resolve Version & Metadata
        id: vars
        env:
          FORCE_FULL_UPDATE: ${{ inputs.full_update || false }}
          OVERRIDE_TAG: ${{ github.event.inputs.tag || '' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST_TAG=$(git for-each-ref --sort=-version:refname --count=1 --format='%(refname:short)' 'refs/tags/v*')
          RELEASE_BASELINE=$(bash scripts/release-baseline.sh)
          RELEASE_MODE=$(bash scripts/release-mode.sh "$RELEASE_BASELINE" HEAD "$FORCE_FULL_UPDATE")
          echo "release_mode=$RELEASE_MODE" >> "$GITHUB_OUTPUT"

          if [ -n "$OVERRIDE_TAG" ]; then
            if [[ ! "$OVERRIDE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
              echo "::error::Invalid override tag format: $OVERRIDE_TAG"
              exit 1
            fi
            TAG="$OVERRIDE_TAG"
            VERSION="${TAG#v}"
          else
            if [ -z "$LATEST_TAG" ]; then
              VERSION="0.0.1"
            else
              V_CLEAN="${LATEST_TAG#v}"
              MAJOR=$(echo "$V_CLEAN" | cut -d. -f1)
              MINOR=$(echo "$V_CLEAN" | cut -d. -f2)
              PATCH=$(echo "$V_CLEAN" | cut -d. -f3 | cut -d- -f1)
              NEXT_PATCH=$((PATCH + 1))
              VERSION="${MAJOR:-0}.${MINOR:-0}.${NEXT_PATCH}"
            fi
            TAG="v$VERSION"
          fi

          BUILD=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          COMMIT_SUBJECT=$(git log -1 --format="%s" 2>/dev/null || echo "Release $TAG")

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "release_title=$TAG — $COMMIT_SUBJECT" >> "$GITHUB_OUTPUT"
          echo "changelog=$TAG — $COMMIT_SUBJECT" >> "$GITHUB_OUTPUT"

  quality-gate:
    name: Quality Gate (Check & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release policy regressions
        run: bash scripts/release.test.sh

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target

      - name: Install mise + nsh
        uses: jdx/mise-action@v5
        with:
          install_args: github:longbridge/nsh
          cache_key_prefix: mise-nsh-v1

      - name: Typecheck
        run: nsh check desktop

      - name: Test Desktop
        run: nsh test desktop

      - name: Test CLI
        run: cargo test --manifest-path cli/Cargo.toml

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: linux
          - platform: macos-arm64
            os: macos-latest
            target: macos
          - platform: windows-x64
            os: windows-latest
            target: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target

      - name: Install mise + nsh
        uses: jdx/mise-action@v5
        with:
          install_args: github:longbridge/nsh
          cache_key_prefix: mise-nsh-v1

      - name: Inject Release Version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" '.version = $v' desktop/nsh.json > desktop/nsh.json.tmp && mv desktop/nsh.json.tmp desktop/nsh.json
          awk -v v="$VERSION" '!done && /^version = "/ { $0 = "version = \"" v "\""; done=1 } { print }' cli/Cargo.toml > cli/Cargo.toml.tmp && mv cli/Cargo.toml.tmp cli/Cargo.toml
          grep -q "^version = \"$VERSION\"$" cli/Cargo.toml

      - name: Build Rust ear CLI
        shell: bash
        run: cargo build --release --manifest-path cli/Cargo.toml

      - name: Package NSH Desktop (${{ matrix.target }})
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: nsh package --target "$MATRIX_TARGET" desktop/

      # Linux archive assembly
      - name: Assemble Linux Bundle
        if: matrix.target == 'linux'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cp cli/target/release/ear .nsh/out/Ear/ear
          chmod +x .nsh/out/Ear/ear
          mv .nsh/out/Ear/Ear .nsh/out/Ear/Ear.bin
          cp scripts/linux-launcher.sh .nsh/out/Ear/Ear
          chmod +x .nsh/out/Ear/Ear
          tar -czf "Ear-${VERSION}-linux-x86_64.tar.gz" -C .nsh/out Ear

      # macOS zip assembly
      - name: Assemble macOS Bundle
        if: matrix.target == 'macos'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p .nsh/out/Ear.app/Contents/Helpers
          cp cli/target/release/ear .nsh/out/Ear.app/Contents/Helpers/ear
          chmod +x .nsh/out/Ear.app/Contents/Helpers/ear
          codesign --force --deep --sign - .nsh/out/Ear.app
          codesign --verify --deep --strict .nsh/out/Ear.app
          ditto -c -k --keepParent .nsh/out/Ear.app "Ear-${VERSION}-macos-aarch64.zip"

      # Windows zip assembly
      - name: Assemble Windows Bundle
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          Copy-Item "cli/target/release/ear.exe" -Destination ".nsh/out/Ear/ear.exe"
          Compress-Archive -Path ".nsh/out/Ear/*" -DestinationPath "Ear-$($env:VERSION)-windows-x86_64.zip"

      - name: Upload Platform Asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            Ear-${{ needs.prepare.outputs.version }}-*.tar.gz
            Ear-${{ needs.prepare.outputs.version }}-*.zip
          if-no-files-found: error

  publish-release:
    name: Publish Release & Manifest
    needs: [quality-gate, prepare, build-desktop]
    if: >-
      always() &&
      needs.quality-gate.result == 'success' &&
      needs.prepare.result == 'success' &&
      needs.build-desktop.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise + nsh
        uses: jdx/mise-action@v5
        with:
          install_args: github:longbridge/nsh
          cache_key_prefix: mise-nsh-v1

      - name: Inject Release Version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" '.version = $v' desktop/nsh.json > desktop/nsh.json.tmp && mv desktop/nsh.json.tmp desktop/nsh.json

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-raw

      - name: Flatten artifacts into dist/
        shell: bash
        run: |
          mkdir -p dist
          find dist-raw -type f -exec mv {} dist/ \;
          ls -la dist/

      - name: Build Signed OTA Package & Manifest
        shell: bash
        env:
          NSH_RELEASE_KEY: ${{ secrets.NSH_RELEASE_KEY }}
          NSH_UPDATE_KEY: ${{ secrets.NSH_UPDATE_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_MODE: ${{ needs.prepare.outputs.release_mode }}
          RELEASE_BUILD: ${{ needs.prepare.outputs.build }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p keys
          if [ -n "$NSH_RELEASE_KEY" ]; then
            printf '%s\n' "$NSH_RELEASE_KEY" > keys/release.secret
            chmod 600 keys/release.secret
          fi
          if [ -n "$NSH_UPDATE_KEY" ]; then
            printf '%s\n' "$NSH_UPDATE_KEY" > keys/update.secret
            chmod 600 keys/update.secret
          fi

          # Also keep raw bytecode bundle for fallback
          nsh package --target linux desktop/
          cp .nsh/out/Ear/nsh/bundle.nshc dist/bundle.nshc

          COMMIT_SUBJECT=$(git log -1 --format="%s" 2>/dev/null || echo "Release $RELEASE_TAG")
          COMMIT_BODY=$(git log -1 --format="%b" 2>/dev/null || true)
          SHORT_SHA=$(git log -1 --format="%h" 2>/dev/null || echo "")
          COMMIT_SHA=$(git log -1 --format="%H" 2>/dev/null || echo "")
          AUTHOR=$(git log -1 --format="%an" 2>/dev/null || echo "Maintainer")

          printf "### What's Changed\n**%s**\n\n%s\n\n---\n- **Commit**: [\`%s\`](https://github.com/%s/commit/%s)\n- **Author**: %s\n" \
            "${COMMIT_SUBJECT}" "${COMMIT_BODY}" "${SHORT_SHA}" "${REPO_SLUG}" "${COMMIT_SHA}" "${AUTHOR}" > dist/release_notes.md

          bash scripts/release-manifest.sh "$RELEASE_MODE" "$RELEASE_BUILD"

          # Also run checksums
          cd dist
          sha256sum * > checksums.txt 2>/dev/null || true
          cd ..

      - name: Display Release Contents
        shell: bash
        run: |
          echo "=== Manifest latest.json ==="
          cat dist/latest.json
          echo "=== Checksums ==="
          cat dist/checksums.txt
          echo "=== Release Notes ==="
          cat dist/release_notes.md

      - name: Create & Push Git Tag
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
          else
            echo "Tagging commit with $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$RELEASE_TITLE"
            git push origin "$TAG"
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_title }}
          body_path: dist/release_notes.md
          files: dist/*
          draft: false
          prerelease: false
