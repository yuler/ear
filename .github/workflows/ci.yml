name: ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup script regressions
        run: bash scripts/setup.test.sh

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mise + nsh
        uses: jdx/mise-action@v5

      - name: Typecheck
        run: mise run check

      - name: Test
        run: mise run test
