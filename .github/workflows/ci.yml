name: ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      desktop: ${{ steps.filter.outputs.desktop }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cli:
              - 'cli/**'
              - 'api/discover/**'
              - 'Cargo.*'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            desktop:
              - 'desktop/**'
              - 'api/**'
              - 'mise.toml'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  cli:
    name: CLI (Rust)
    needs: detect-changes
    if: needs.detect-changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup & install script regressions
        run: |
          bash scripts/setup.test.sh
          bash scripts/install-prod.test.sh

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target

      - name: Run Ear CLI Tests
        run: cargo test --manifest-path cli/Cargo.toml

  desktop:
    name: Desktop (Native Shell)
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise + nsh
        uses: jdx/mise-action@v5
        with:
          install_args: github:longbridge/nsh
          cache_key_prefix: mise-nsh-v1

      - name: Typecheck
        run: nsh check desktop

      - name: Run Desktop Tests
        run: nsh test desktop

  web:
    name: Web (Landing & Worker)
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax Check
        run: |
          for script in web/worker.js web/public/main.js web/public/i18n.js web/public/player-demo.js web/public/player-mock.js web/public/player-cursor.js web/public/player-controls.js; do
            node --check "$script" || exit 1
          done

      - name: Web regressions
        run: node --test web/tests/*.test.cjs

  ci-status:
    name: Check & Test
    needs: [detect-changes, cli, desktop, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release policy regressions
        run: bash scripts/release.test.sh

      - name: iOS prototype regressions
        run: node --test prototypes/ios/*.test.cjs

      - name: Evaluate status
        run: |
          DETECT_RES="${{ needs.detect-changes.result }}"
          CLI_RES="${{ needs.cli.result }}"
          DESKTOP_RES="${{ needs.desktop.result }}"
          WEB_RES="${{ needs.web.result }}"

          echo "Change detection result: $DETECT_RES"
          if [ "$DETECT_RES" != "success" ]; then
            echo "Error: Change detection did not succeed." >&2
            exit 1
          fi

          echo "CLI result: $CLI_RES"
          echo "Desktop result: $DESKTOP_RES"
          echo "Web result: $WEB_RES"

          for res in "$CLI_RES" "$DESKTOP_RES" "$WEB_RES"; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "Error: One or more parallel CI jobs failed." >&2
              exit 1
            fi
          done

          echo "All required checks passed or were cleanly skipped."
