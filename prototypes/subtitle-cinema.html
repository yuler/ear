<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>沉浸式字幕原型</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* Style switcher: nearly invisible until hovered, so the room stays dark */
  .bar { position: fixed; top: 14px; left: 16px; z-index: 10; display: flex; gap: 6px; align-items: center;
    opacity: 0.22; transition: opacity 300ms; }
  .bar:hover { opacity: 1; }
  .bar button { font: inherit; font-size: 12px; padding: 4px 11px; border-radius: 999px; cursor: pointer;
    background: transparent; color: #999; border: 1px solid #333; }
  .bar button.on { color: #fff; border-color: #888; }
  .bar .desc { font-size: 12px; color: #888; margin-left: 8px; }
  .keys { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 11px; color: #333; }

  #app { height: 100vh; display: flex; align-items: center; justify-content: center; }

  /* Video placeholder: slow drifting colour field stands in for real footage */
  .video { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 4px; background: #111;
    box-shadow: 0 0 120px rgba(90, 120, 255, 0.07); }
  .scene { position: absolute; inset: -25%;
    background:
      radial-gradient(circle at 30% 40%, #b4532a 0, transparent 38%),
      radial-gradient(circle at 70% 60%, #283e8c 0, transparent 42%),
      radial-gradient(circle at 50% 90%, #6b2a6e 0, transparent 40%), #120d14;
    filter: blur(20px) saturate(1.1); animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(8%, -6%) rotate(8deg) scale(1.1); } }
  .paused .scene { animation-play-state: paused; }
  .prog { position: absolute; left: 0; bottom: 0; height: 2px; background: rgba(255, 255, 255, 0.55); }
  .pause { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; color: #fff;
    opacity: 0; transition: opacity 200ms; }
  .paused .pause { opacity: 0.7; }

  .subs { position: relative; overflow: hidden; }
  .inner { position: relative; transition: transform 650ms cubic-bezier(0.16, 1, 0.3, 1); }
  .line { cursor: pointer; }
  .w { transition: color 220ms, opacity 220ms; }
  .ts { display: none; }

  /* ── A 影院字幕带: centered 3-line record under the video, progress underline highlight ── */
  .s-a #app { flex-direction: column; }
  .s-a .video, .s-a .subs { width: min(78vw, calc((100vh - 170px) * 16 / 9)); }
  .s-a .subs { height: 60px; margin-top: 20px;
    mask-image: linear-gradient(to bottom, transparent 0, #000 45%); }
  .s-a .line { text-align: center; font-size: 12px; line-height: 20px; letter-spacing: 0.03em;
    color: rgba(255, 255, 255, 0.22); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color 400ms; }
  .s-a .line.cur { color: rgba(255, 255, 255, 0.92); }
  .s-a .txt { position: relative; display: inline-block; }
  .s-a .line.cur .txt::after { content: ""; position: absolute; left: 0; bottom: 1px; height: 1px;
    width: calc(var(--p, 0) * 100%); background: rgba(255, 255, 255, 0.6); }

  /* ── B 场记日志: timestamped log column beside the video, words ignite as spoken ── */
  .s-b #app { gap: 36px; padding: 0 40px; }
  .s-b .video { flex: 1; max-width: calc(100vw - 380px); max-height: 82vh; }
  .s-b .subs { width: 250px; height: 70vh;
    mask-image: linear-gradient(to bottom, transparent 0, #000 35%); }
  .s-b .inner { display: flex; flex-direction: column; gap: 8px; }
  .s-b .line { font: 11px/1.55 ui-monospace, "SF Mono", Menlo, monospace; color: #555;
    padding-left: 10px; border-left: 1px solid transparent; transition: border-color 300ms; }
  .s-b .ts { display: inline; color: #333; margin-right: 6px; }
  .s-b .line.cur { border-left-color: rgba(255, 255, 255, 0.8); }
  .s-b .line.cur .w { color: #2a2a2a; }
  .s-b .line.cur .w.on { color: #eee; }

  /* ── C 走马灯: one-line ticker, newest sentence types out on the right with a glowing dot ── */
  .s-c #app { flex-direction: column; }
  .s-c .video, .s-c .subs { width: min(78vw, calc((100vh - 140px) * 16 / 9)); }
  .s-c .subs { height: 22px; margin-top: 18px;
    mask-image: linear-gradient(to right, transparent 0, #000 25%, #000 88%, transparent 100%); }
  .s-c .inner { display: flex; gap: 34px; white-space: nowrap; }
  .s-c .line { font-size: 12px; line-height: 22px; color: rgba(255, 255, 255, 0.25); }
  .s-c .line.cur { color: #fff; }
  .s-c .line.cur .w { opacity: 0; }
  .s-c .line.cur .w.on { opacity: 1; }
  .s-c .line.cur::before { content: ""; display: inline-block; width: 4px; height: 4px; margin: 0 8px 2px 0;
    border-radius: 50%; background: #fff; box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.6);
    vertical-align: middle; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
</style>
</head>
<body class="s-a">
<div class="bar">
  <button data-s="a">A 影院字幕带</button>
  <button data-s="b">B 场记日志</button>
  <button data-s="c">C 走马灯</button>
  <span class="desc" id="desc"></span>
</div>
<div id="app">
  <div class="video" id="video">
    <div class="scene"></div>
    <div class="pause">❚❚</div>
    <div class="prog" id="prog"></div>
  </div>
  <div class="subs" id="subs"><div class="inner" id="inner"></div></div>
</div>
<div class="keys">Space 暂停 · 1 / 2 / 3 切换风格 · ← → 上一句 / 下一句 · M 打码 · 点击记录跳转</div>

<script>
  const TEXTS = [
    "Welcome back to the channel everyone",
    "Today we are going to talk about listening",
    "Most people think they need more vocabulary first",
    "But the real problem is speed and connected speech",
    "Native speakers blend words together all the time",
    "So you hear one long sound instead of separate words",
    "The trick is to slow it down and loop each sentence",
    "Then gradually bring it back to full speed",
    "Let's try that with a short example right now",
    "Listen carefully and try to catch every single word",
    "Don't worry if you miss some on the first try",
    "That is completely normal and part of the process",
    "Okay let's start with the first one",
  ];
  const DESC = {
    a: "视频下方居中三行记录，当前句变亮并有一条随语音推进的细下划线",
    b: "视频右侧带时间戳的日志栏，当前句左侧一道竖线，单词随语音逐个点亮",
    c: "视频下方单行走马灯，新句子在右侧逐词打出，前面有一个呼吸的光点",
  };

  // Timeline: each sentence lasts ~330ms per word plus a short gap
  let acc = 0;
  const SENT = TEXTS.map((text, i) => {
    const words = text.split(" ");
    const s = { i, text, words, start: acc, dur: words.length * 330 + 500 };
    acc += s.dur;
    return s;
  });
  const TOTAL = acc;

  const state = { t: 0, playing: true, mask: true, style: "a" };
  const els = []; // rendered record lines, index === sentence index
  const $ = (id) => document.getElementById(id);
  const inner = $("inner"), subs = $("subs"), video = $("video"), prog = $("prog");

  const fmt = (ms) => { const s = Math.floor(ms / 1000) + 22; return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const wordText = (w) => (state.mask ? "•".repeat(w.length) : w);

  function makeLine(s) {
    const el = document.createElement("div");
    el.className = "line";
    el.innerHTML = `<span class="ts">${fmt(s.start)}</span><span class="txt"></span>`;
    const txt = el.querySelector(".txt");
    el.words = s.words.map((w, k) => {
      const span = document.createElement("span");
      span.className = "w on";
      span.textContent = wordText(w);
      txt.append(span);
      if (k < s.words.length - 1) txt.append(" ");
      return span;
    });
    el.nOn = s.words.length;
    el.addEventListener("click", () => jump(s.i));
    inner.append(el);
    return el;
  }

  function setOn(el, n) {
    if (el.nOn === n) return;
    el.nOn = n;
    el.words.forEach((w, k) => w.classList.toggle("on", k < n));
  }

  function indexAt(t) {
    let i = 0;
    while (i < SENT.length - 1 && t >= SENT[i + 1].start) i++;
    return i;
  }

  function jump(i) {
    i = Math.max(0, Math.min(SENT.length - 1, i));
    state.t = SENT[i].start;
    while (els.length > i + 1) els.pop().remove(); // record only keeps what has been heard
  }

  function position(cur) {
    if (state.style === "c") {
      inner.style.transform = `translateX(${subs.clientWidth * 0.42 - cur.offsetLeft}px)`;
    } else {
      inner.style.transform = `translateY(${subs.clientHeight - (cur.offsetTop + cur.offsetHeight)}px)`;
    }
  }

  let last = performance.now();
  function frame(now) {
    if (state.playing) state.t += now - last;
    last = now;
    if (state.t >= TOTAL) { state.t = 0; els.splice(0).forEach((e) => e.remove()); }

    const i = indexAt(state.t);
    const s = SENT[i];
    while (els.length <= i) els.push(makeLine(SENT[els.length]));
    const p = Math.min(1, (state.t - s.start) / (s.dur - 400));

    els.forEach((el, k) => {
      el.classList.toggle("cur", k === i);
      if (k < i) setOn(el, el.words.length);
    });
    const cur = els[i];
    setOn(cur, Math.ceil(p * s.words.length));
    cur.style.setProperty("--p", p.toFixed(3));
    position(cur);
    prog.style.width = `${(state.t / TOTAL) * 100}%`;
    video.classList.toggle("paused", !state.playing);
    requestAnimationFrame(frame);
  }

  function setStyle(k) {
    state.style = k;
    document.body.className = `s-${k}`;
    document.querySelectorAll(".bar button").forEach((b) => b.classList.toggle("on", b.dataset.s === k));
    $("desc").textContent = DESC[k];
  }

  function toggleMask() {
    state.mask = !state.mask;
    els.forEach((el, k) => el.words.forEach((w, j) => (w.textContent = wordText(SENT[k].words[j]))));
  }

  document.querySelectorAll(".bar button").forEach((b) => b.addEventListener("click", () => setStyle(b.dataset.s)));
  video.addEventListener("click", () => (state.playing = !state.playing));
  document.addEventListener("keydown", (e) => {
    const i = indexAt(state.t);
    if (e.key === " ") { e.preventDefault(); state.playing = !state.playing; }
    else if (e.key === "ArrowRight") jump(i + 1);
    else if (e.key === "ArrowLeft") jump(i - 1);
    else if (e.key === "m" || e.key === "M") toggleMask();
    else if (e.key >= "1" && e.key <= "3") setStyle("abc"[Number(e.key) - 1]);
  });

  setStyle(DESC[location.hash.slice(1)] ? location.hash.slice(1) : "a");
  jump(3);
  requestAnimationFrame(frame);
</script>
</body>
</html>
