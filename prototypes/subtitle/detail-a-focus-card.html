<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 A · 焦点精听卡片舞台 — Ear Desktop 原型</title>
<link rel="stylesheet" href="./detail-shared.css" />
<style>
  /* 方案 A: 比例克制 — 横屏 53:47, 竖屏视频左 >= 55%, 右侧卡片栏 <= 45% */
  .detail-root.is-landscape { --land-video-h: 53%; }
  .detail-root.is-portrait { --port-sub-w: 45%; --port-sub-max: 520px; }

  .a-wrap {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 20px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .a-col {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: auto 0;
  }

  /* 弱化上下文句（卡片外） */
  .a-ctx {
    padding: 6px 14px;
    border-radius: 10px;
    text-align: left;
    transition: background 140ms, opacity 140ms;
    opacity: 0.44;
  }
  .a-ctx:hover { opacity: 0.85; background: var(--well); }
  .a-ctx-en { font-size: 16px; font-weight: 600; color: var(--fg); line-height: 1.35; }
  .a-ctx-zh { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .a-ctx.is-far { opacity: 0.24; }
  .a-ctx.is-far:hover { opacity: 0.72; }

  /* 焦点主卡片（参考截图核心层次） */
  .a-focus-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px 20px 12px;
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .a-focus-card .sentence-words { font-size: 24px; }
  .a-trans {
    font-size: 15px;
    line-height: 1.5;
    color: var(--muted);
    padding-left: 3px;
  }

  /* 横屏 800×560 最小窗口自适应收紧 */
  .app-window.win-sm .a-wrap { padding: 10px 14px 12px; }
  .app-window.win-sm .a-col { gap: 7px; }
  .app-window.win-sm .a-focus-card { padding: 12px 14px 9px; border-radius: 14px; gap: 7px; }
  .app-window.win-sm .a-focus-card .sentence-words { font-size: 19px; }
  .app-window.win-sm .a-trans { font-size: 13px; }
  .app-window.win-sm .a-ctx { padding: 4px 10px; }
  .app-window.win-sm .a-ctx-en { font-size: 14px; }
  .app-window.win-sm .a-ctx-zh { font-size: 12px; }
  .app-window.win-sm .detail-root.is-landscape .a-ctx.hide-sm { display: none; }

  /* 大屏 1600+ 下横向呼吸感增强 */
  .app-window.win-lg .detail-root.is-landscape .a-col { max-width: 820px; }
  .app-window.win-lg .a-focus-card .sentence-words { font-size: 27px; }
  .app-window.win-lg .a-trans { font-size: 16px; }
</style>
</head>
<body>
<script src="./detail-data.js"></script>
<script src="./detail-shared.js"></script>
<script>
  EarDetailProto.mountPrototype({
    id: "a",
    renderSubtitle(container, state, api) {
      const list = api.transcript;
      const cur = list[state.activeIdx];
      const prev1 = list[state.activeIdx - 1];
      const prev2 = list[state.activeIdx - 2];
      const next1 = list[state.activeIdx + 1];
      const next2 = list[state.activeIdx + 2];

      const ctxRow = (s, extra = "") =>
        s ? `<button class="a-ctx ${extra}" data-jump="${s.id}">
              <div class="a-ctx-en">${state.blind ? s.en.replace(/[A-Za-z']/g, "•") : s.en}</div>
              ${state.showTrans && !state.blind ? `<div class="a-ctx-zh">${s.zh}</div>` : ""}
            </button>` : "";

      const isPort = state.orientation === "portrait";
      container.innerHTML = `
        <div class="a-wrap">
          <div class="a-col">
            ${isPort ? ctxRow(prev2, "is-far") : ""}
            ${ctxRow(prev1, "hide-sm")}
            ${api.renderCalloutHtml(cur)}
            <article class="a-focus-card">
              <div class="sentence-words">${api.renderWordsHtml(cur)}</div>
              ${state.showTrans ? `<div class="a-trans">${state.blind ? "（盲听态：点词揭晓或按 M 显示原文与译文）" : cur.zh}</div>` : ""}
              ${state.showAi ? `<div class="ai-box"><strong>AI 精讲：</strong>${cur.ai}</div>` : ""}
              ${api.renderActionBarHtml(cur)}
            </article>
            ${ctxRow(next1)}
            ${isPort ? ctxRow(next2, "is-far") : ""}
          </div>
        </div>
      `;
    },
  });
</script>
</body>
</html>
